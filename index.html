<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X GOᵀ Store</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg-color: #090d16;
      --card-bg: #121824;
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #f59e0b;
      --primary-hover: #d97706;
      --accent-green: #10b981;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* Header Design */
    header {
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(12px);
      padding: 0.8rem 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--card-border);
      gap: 12px;
    }

    .logo-img {
      height: 66px;
      width: auto;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .logo-img:active { transform: scale(0.95); }

    /* Search Box */
    .search-box {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 4px 6px 4px 14px;
      flex: 1;
      max-width: 450px;
      transition: border-color 0.2s;
    }
    .search-box:focus-within { border-color: var(--primary); }
    .search-box input {
      background: transparent;
      border: none;
      color: #fff;
      outline: none;
      width: 100%;
      font-size: 0.9rem;
    }
    .search-btn {
      background: var(--primary);
      border: none;
      color: white;
      padding: 6px 14px;
      border-radius: 16px;
      cursor: pointer;
      font-weight: 600;
    }

    /* Category Bar */
    .category-bar {
      display: flex;
      gap: 8px;
      padding: 0.8rem 1.2rem;
      overflow-x: auto;
      background: rgba(18, 24, 36, 0.6);
      border-bottom: 1px solid var(--card-border);
      scrollbar-width: none;
    }
    .category-bar::-webkit-scrollbar { display: none; }
    
    .category-tab {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 16px;
      border-radius: 16px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    .category-tab.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.3);
    }

    /* Main Grid (จัดแบบ 2 บล็อกคู่เรียงลงมา) */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem;
      width: 100%;
      flex: 1;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr); /* 2 บล็อกเสมอ */
      gap: 10px;
    }

    @media (min-width: 768px) {
      .product-grid {
        grid-template-columns: repeat(4, 1fr); /* จอใหญ่แสดง 4 บล็อก */
        gap: 16px;
      }
    }

    /* Product Card Design */
    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
    }
    .product-card:active { transform: scale(0.98); }
    
    .product-card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background: #0d121d;
    }

    .product-info {
      padding: 0.8rem;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .product-title {
      font-size: 0.85rem;
      font-weight: 500;
      line-height: 1.3;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: var(--text-main);
    }

    .price-box {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .promo-price { color: var(--accent-green); font-size: 1.05rem; font-weight: 700; }
    .original-price { color: var(--text-muted); font-size: 0.75rem; text-decoration: line-through; }

    /* Skeleton Loading Effect */
    .skeleton-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      height: 240px;
      display: flex;
      flex-direction: column;
    }
    .skeleton-img {
      width: 100%;
      height: 140px;
      background: linear-gradient(90deg, #121824 25%, #1c2536 50%, #121824 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    .skeleton-text {
      height: 12px;
      margin: 8px;
      border-radius: 4px;
      background: linear-gradient(90deg, #121824 25%, #1c2536 50%, #121824 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

    /* Modals & Overlays */
    .modal {
      display: none;
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(6px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }
    .modal-content {
      background: #161e2e;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      padding: 1.5rem;
      position: relative;
      animation: popup 0.25s ease-out;
    }
    @keyframes popup { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .close-btn {
      position: absolute;
      top: 12px; right: 16px;
      font-size: 1.2rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    /* Modal สินค้า */
    .detail-img { width: 100%; border-radius: 12px; aspect-ratio: 1/1; object-fit: cover; margin-bottom: 12px; }
    .detail-title { font-size: 1.1rem; margin-bottom: 8px; }
    .detail-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px; max-height: 100px; overflow-y: auto; }

    /* ปุ่มเครื่องบินกระดาษ (Paper Plane Confirm) */
    .btn-plane {
      background: var(--primary);
      color: white;
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      position: relative;
      transition: background 0.2s;
    }
    .btn-plane:hover { background: var(--primary-hover); }
    
    /* Animation สำหรับไอคอนเครื่องบิน */
    .plane-icon { transition: transform 0.5s ease-in-out; }
    .btn-plane.flying .plane-icon {
      transform: translate(200px, -200px) scale(1.5) rotate(-20deg);
    }

    /* Toast Notification (ระบบแจ้งเตือนแบบเท่ๆ) */
    .toast-container {
      position: fixed;
      bottom: 20px; right: 20px;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .toast {
      background: #1e293b;
      border-left: 4px solid var(--primary);
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <img src="Logo.png" alt="Logo" class="logo-img" id="secretLogo" onerror="this.src='https://via.placeholder.com/120x36/090d16/ffffff?text=PRIME'">
    
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="ค้นหาสินค้า...">
      <button class="search-btn" onclick="executeSearch()"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>
  </header>

  <!-- แท็บหมวดหมู่ (เริ่มต้นเปิดด้วย 'ทั้งหมด') -->
  <div class="category-bar" id="categoryBar">
    <button class="category-tab active" onclick="selectCategory('ทั้งหมด', this)">ทั้งหมด</button>
  </div>

  <!-- Main Container -->
  <div class="container">
    <!-- Grid 2 บล็อก -->
    <div class="product-grid" id="productGrid"></div>

    <div id="noProducts" style="display:none; text-align:center; padding: 4rem 1rem; color: var(--text-muted);">
      <i class="fa-solid fa-box-open" style="font-size: 2.5rem; opacity:0.3; margin-bottom:10px;"></i>
      <p style="font-size: 0.9rem;">ไม่มีรายการสินค้า</p>
    </div>
  </div>

  <!-- Modal รายละเอียดสินค้า -->
  <div class="modal" id="productDetailModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('productDetailModal')">&times;</span>
      <img id="mImg" src="" class="detail-img">
      <h3 id="mTitle" class="detail-title"></h3>
      <div id="mPriceBox" class="price-box" style="margin-bottom:10px;"></div>
      <p id="mDesc" class="detail-desc"></p>
      
      <button class="btn-plane" id="confirmBtn" onclick="triggerPaperPlaneAndGo()">
        <span>ยืนยันไปยังสินค้า</span>
        <i class="fa-solid fa-paper-plane plane-icon"></i>
      </button>
    </div>
  </div>

  <!-- Modal แอดมิน ลับ (ไม่มีคำใบ้ คนภายนอกมองไม่ออก) -->
  <div class="modal" id="adminAuthModal">
    <div class="modal-content" style="text-align: center;">
      <span class="close-btn" onclick="closeModal('adminAuthModal')">&times;</span>
      <h3 style="letter-spacing: 2px;">...</h3>
      <input type="email" id="adminEmail" placeholder="Email" style="width:100%; padding:10px; margin:15px 0; background:rgba(255,255,255,0.05); border:1px solid var(--card-border); border-radius:8px; color:#fff;">
      <button class="btn-plane" onclick="checkAdminEmail()">Next</button>
    </div>
  </div>

  <div class="modal" id="adminPinModal">
    <div class="modal-content" style="text-align: center;">
      <span class="close-btn" onclick="closeModal('adminPinModal')">&times;</span>
      <h3 id="adminRoleDisplay">...</h3>
      <input type="password" id="adminPin" maxlength="6" placeholder="PIN" style="width:100%; padding:10px; margin:15px 0; background:rgba(255,255,255,0.05); border:1px solid var(--card-border); border-radius:8px; color:#fff; text-align:center; font-size:1.2rem; letter-spacing:4px;">
      <button class="btn-plane" onclick="checkAdminPin()">Confirm</button>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <!-- ดึงไฟล์คลังและสิทธิ์ -->
  <script src="ass.js"></script>
  <script src="warehouse.js"></script>

  <script>
    // 🔑 รหัสยืนยันสำหรับส่งไปขอข้อมูลจาก warehouse.js
    const STORE_CLIENT_REQ_KEY = "REQ_PRIME_STORE_2026";
    const SECRET_SEARCH_KEY = "Xxx++&+&+&+&+&+&+&+&+&+-+&+&+&+&+&++&+&+&+&+&+&+&+&+&++&+&+&+&+&+&+&+&+&938383737366262626263663636320927446PrimeStoregf dhdhdhdhhdhdhdhdhdhfdhdhdhdhdtgbnmqwe&&&$&&&&";
    
    let activeProducts = [];
    let selectedProductLink = "#";
    let isSecretUnlocked = false;
    let targetStaffAccount = null;
    let currentCategoryFilter = "ทั้งหมด";

    document.addEventListener("DOMContentLoaded", () => {
      loadCategoryTabs();
      fetchProductsData(currentCategoryFilter);
      setupLogoSecret();
      setupWarehouseListener();
    });

    // ฟังการส่งข้อมูลอัปเดตจากคลังสินค้า (เมื่อแอดมินแก้ไขข้อมูล)
    function setupWarehouseListener() {
      window.addEventListener('warehouse_data_sync', (e) => {
        if (e.detail && e.detail.responseCode === "RES_PRIME_OK_9999") {
          loadCategoryTabs();
          fetchProductsData(currentCategoryFilter);
          showToast("ข้อมูลสินค้ามีการอัปเดตแล้ว");
        }
      });
    }

    // แจ้งเตือนแบบ Toast
    function showToast(msg, type = "info") {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = `<i class="fa-solid fa-circle-info" style="color:var(--primary);"></i> <span>${msg}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // โครงกระดูก Skeleton โหลดสินค้า
    function showSkeletonLoading() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';
      for (let i = 0; i < 6; i++) {
        grid.innerHTML += `
          <div class="skeleton-card">
            <div class="skeleton-img"></div>
            <div class="skeleton-text" style="width:80%;"></div>
            <div class="skeleton-text" style="width:40%;"></div>
          </div>
        `;
      }
    }

    // โหลดสินค้าจาก warehouse.js โดยใช้รหัสผ่านยืนยัน
    function fetchProductsData(categoryFilter = "ทั้งหมด") {
      showSkeletonLoading();
      document.getElementById('noProducts').style.display = 'none';

      setTimeout(() => {
        // ส่ง STORE_CLIENT_REQ_KEY ไปขอข้อมูล
        const rawProducts = (typeof getWarehouseProducts === 'function') 
          ? getWarehouseProducts(STORE_CLIENT_REQ_KEY) 
          : (WAREHOUSE_DATABASE?.products || []);
        
        if (categoryFilter === "ทั้งหมด") {
          activeProducts = rawProducts;
        } else {
          activeProducts = rawProducts.filter(p => p.category === categoryFilter);
        }

        renderGrid(activeProducts);
      }, 300); 
    }

    // วาดการ์ดแบบ 2 บล็อก
    function renderGrid(products) {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';

      if (products.length === 0) {
        document.getElementById('noProducts').style.display = 'block';
        return;
      }

      products.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.onclick = () => openProductDetail(p);
        card.innerHTML = `
          <img src="${p.image}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/200?text=Prime'">
          <div class="product-info">
            <div class="product-title">${p.name}</div>
            <div class="price-box">
              ${p.pricePromo ? `<span class="promo-price">฿${p.pricePromo}</span>` : ''}
              ${p.priceOriginal ? `<span class="original-price">฿${p.priceOriginal}</span>` : ''}
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // สร้างแท็บหมวดหมู่
    function loadCategoryTabs() {
      const bar = document.getElementById('categoryBar');
      bar.innerHTML = '';
      
      const categories = (typeof getWarehouseCategories === 'function') 
        ? getWarehouseCategories(STORE_CLIENT_REQ_KEY) 
        : (WAREHOUSE_DATABASE?.categories || ["ทั้งหมด"]);

      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `category-tab ${cat === currentCategoryFilter ? 'active' : ''}`;
        btn.innerText = cat;
        btn.onclick = (e) => selectCategory(cat, e.target);
        bar.appendChild(btn);
      });
    }

    function selectCategory(catName, btnEl) {
      currentCategoryFilter = catName;
      document.querySelectorAll('.category-tab').forEach(b => b.classList.remove('active'));
      btnEl.classList.add('active');
      fetchProductsData(catName);
    }

    // ค้นหาสินค้า / ช่องลับเข้าแอดมิน
    function executeSearch() {
      const query = document.getElementById('searchInput').value.trim();
      
      if (query === SECRET_SEARCH_KEY) {
        isSecretUnlocked = true;
        document.getElementById('searchInput').value = '';
        showToast("Search complete");
        return;
      }

      showSkeletonLoading();
      setTimeout(() => {
        const rawProducts = (typeof getWarehouseProducts === 'function') 
          ? getWarehouseProducts(STORE_CLIENT_REQ_KEY) 
          : [];

        const filtered = rawProducts.filter(p => 
          p.name.toLowerCase().includes(query.toLowerCase())
        );
        renderGrid(filtered);
      }, 300);
    }

    // เปิด Modal รายละเอียดสินค้า
    function openProductDetail(product) {
      document.getElementById('mImg').src = product.image;
      document.getElementById('mTitle').innerText = product.name;
      document.getElementById('mDesc').innerText = product.details || "ไม่มีรายละเอียดเพิ่มเติม";
      
      const priceBox = document.getElementById('mPriceBox');
      priceBox.innerHTML = `
        ${product.pricePromo ? `<span class="promo-price" style="font-size:1.3rem;">฿${product.pricePromo}</span>` : ''}
        ${product.priceOriginal ? `<span class="original-price" style="text-decoration:line-through;">฿${product.priceOriginal}</span>` : ''}
      `;

      selectedProductLink = product.link || "#";
      openModal('productDetailModal');
    }

    // เอฟเฟกต์เครื่องบินกระดาษร่อนพุ่งออกไป
    function triggerPaperPlaneAndGo() {
      const btn = document.getElementById('confirmBtn');
      btn.classList.add('flying');

      setTimeout(() => {
        window.location.href = selectedProductLink;
        setTimeout(() => {
          btn.classList.remove('flying');
          closeModal('productDetailModal');
        }, 500);
      }, 600);
    }

    // ระบบทางเข้าลับ กด 6 ครั้ง
    let clickCount = 0;
    let clickTimer = null;
    function setupLogoSecret() {
      document.getElementById('secretLogo').addEventListener('click', () => {
        if (!isSecretUnlocked) return; 

        clickCount++;
        clearTimeout(clickTimer);

        if (clickCount >= 6) {
          clickCount = 0;
          openModal('adminAuthModal');
        } else {
          clickTimer = setTimeout(() => { clickCount = 0; }, 1800);
        }
      });
    }

    function checkAdminEmail() {
      const email = document.getElementById('adminEmail').value.trim();
      const staff = (typeof ADMIN_STAFF_DATABASE !== 'undefined') ? 
        ADMIN_STAFF_DATABASE.find(s => s.email.toLowerCase() === email.toLowerCase()) : null;

      if (staff) {
        targetStaffAccount = staff;
        closeModal('adminAuthModal');
        document.getElementById('adminRoleDisplay').innerText = staff.role;
        openModal('adminPinModal');
      } else {
        closeModal('adminAuthModal');
      }
    }

    function checkAdminPin() {
      const pin = document.getElementById('adminPin').value.trim();
      if (targetStaffAccount && pin === targetStaffAccount.pin) {
        window.location.href = targetStaffAccount.redirect; // ไป Boss.html
      } else {
        closeModal('adminPinModal');
      }
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
  </script>
</body>
</html>
